<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joyedforlife Studios</title>
    <style>
        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at top, #2e003e, #15001c);
            color: white;
            text-align: center;
            overflow-x: hidden;
        }

        /* NAVBAR */
        nav {
            width: 100%;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            gap: 50px;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
            animation-delay: 0.3s;
        }

        nav a {
            color: white;
            text-decoration: none;
            transition: opacity .3s ease, transform .3s ease;
        }

        nav a:hover {
            opacity: 0.6;
            transform: translateY(-3px);
        }

        /* LOGO */
        .logo {
            margin-top: 40px;
            width: 300px;
            animation: floatIn 1.2s ease forwards;
            opacity: 0;
            transform: translateY(40px);
        }

        /* TITLE */
        h1 {
            font-size: 50px;
            margin-top: 10px;
            text-shadow: 0px 4px 12px rgba(0,0,0,0.5);
            opacity: 0;
            animation: fadeInUp 1.2s ease forwards;
            animation-delay: 0.6s;
        }

        p {
            font-size: 20px;
            width: 70%;
            margin: 10px auto 30px auto;
            opacity: 0;
            animation: fadeInUp 1.2s ease forwards;
            animation-delay: 0.8s;
        }

        /* BUTTON */
        .btn {
            padding: 15px 35px;
            font-size: 22px;
            background: #c4451c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            opacity: 0;
            animation: fadeInUp 1.2s ease forwards;
            animation-delay: 1.1s;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        /* ANIMATIONS */
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes floatIn {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>

    <!-- NAVIGATION -->
    <nav>
        <a href="../index">Home</a>
        <a href="../contact">Contact</a>
        <a href="../info">Info</a>
        <a href="../socials">Socials</a>
    </nav>

    <!-- LOGO -->
    <img src="logo.png" alt="Joyedforlife Studios Logo" class="logo">

    <!-- TITLE & DESCRIPTION -->
    <h1>Joyedforlife Studios</h1>
    <p>
        Creating high-quality Minecraft plugins, mods, datapacks, resource packs,
        and full custom server setups — all crafted with passion and creativity.
    </p>

    <!-- MAIN BUTTON -->
    <button class="btn">VIEW ALL RESOURCES</button>

</body>
</html>
