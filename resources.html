<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources – Joyedforlife Studios</title>

    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at top, #2e003e, #15001c);
            font-family: 'Montserrat', sans-serif;
            color: white;
            overflow-x: hidden;
        }

        /* NAVBAR */
        nav {
            width: 100%;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            gap: 50px;
            font-size: 20px;
            font-weight: 600;
        }

        nav a {
            color: white;
            text-decoration: none;
            transition: opacity .3s ease;
        }

        nav a:hover {
            opacity: .6;
        }

        /* PAGE TITLE */
        h1 {
            text-align: center;
            margin-top: 10px;
            font-size: 50px;
        }

        /* TAG FILTERS */
        .tag-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .tag {
            padding: 10px 20px;
            background: #3b006a;
            border-radius: 8px;
            cursor: pointer;
            transition: .3s ease;
        }

        .tag:hover,
        .tag.active {
            background: #55009d;
        }

        /* RESOURCE GRID */
        .grid {
            max-width: 1100px;
            margin: auto;
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            padding: 0 20px 50px 20px;
        }

        .card {
            background: #26003d;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            transition: transform .25s ease, box-shadow .25s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .card img {
            width: 110px;
            margin-bottom: 10px;
        }

        .card h2 {
            margin: 0;
            font-size: 26px;
        }

        .card p {
            opacity: .7;
        }

        /* POPUP */
        .popup-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            display: none;
            align-items: center;
            justify-content: center;
        }

        .popup {
            background: #20002e;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            animation: fadeIn .3s ease;
        }

        @keyframes fadeIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .popup img {
            width: 120px;
            margin-bottom: 10px;
        }

        .popup button {
            padding: 14px 35px;
            background: #c4451c;
            border: none;
            color: white;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            transition: .2s;
        }

        .popup button:hover {
            transform: translateY(-5px);
        }
    </style>
</head>

<body>

<!-- NAV -->
<nav>
    <a href="index.html">Home</a>
    <a href="contact.html">Contact</a>
</nav>

<h1>Resources</h1>

<!-- TAGS -->
<div class="tag-bar">
    <div class="tag active" data-tag="all">All</div>
    <div class="tag" data-tag="plugin">Plugins</div>
    <div class="tag" data-tag="mod">Mods</div>
    <div class="tag" data-tag="datapack">Datapacks</div>
    <div class="tag" data-tag="other">Other</div>
</div>

<!-- RESOURCE GRID -->
<div class="grid">

    <!-- COPY/PASTE THIS BLOCK TO ADD MORE RESOURCES -->
    <div class="card" data-type="plugin" data-name="JoyedCombat" data-file="resources/Joyedcombat-1.0.jar" data-desc="JoyedCombat is a customizable combat-tag plugin that tracks players individually, prevents combat logging">
        <img src="../resources/joyedcombat-logo.png">
        <h2>JoyedCombat</h2>
        <p>JoyedCombat is a customizable combat-tag plugin that tracks players individually, prevents combat logging</p>
    </div>
    <div class="card" data-type="datapack" data-name="Nametag" data-file="resources/nametag.zip" data-desc="Adds the mew 26.1 nametag recipe to your game">
        <img src="../resources/nametag.png">
        <h2>New Nametag Update Recipe</h2>
        <p>Adds the new recipe from the 26.1 snapshot 1 recipe.</p>
    </div>

</div>

<!-- POPUP -->
<div class="popup-bg" id="popup-bg">
    <div class="popup">
        <img src="logo.png" id="popup-logo">
        <h2 id="popup-title"></h2>
        <p id="popup-desc"></p>

        <a id="download-link" download>
            <button>Download</button>
        </a>
    </div>
</div>

<script>
    // Tag filtering
    const tags = document.querySelectorAll('.tag');
    const cards = document.querySelectorAll('.card');

    tags.forEach(tag => {
        tag.addEventListener('click', () => {
            tags.forEach(t => t.classList.remove('active'));
            tag.classList.add('active');

            const type = tag.dataset.tag;

            cards.forEach(card => {
                if (type === "all" || card.dataset.type === type) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }
            });
        });
    });

    // Popup system
    const popupBg = document.getElementById('popup-bg');
    const popupTitle = document.getElementById('popup-title');
    const popupDesc = document.getElementById('popup-desc');
    const downloadLink = document.getElementById('download-link');

    cards.forEach(card => {
        card.addEventListener('click', () => {
            popupTitle.textContent = card.dataset.name;
            popupDesc.textContent = card.dataset.desc;
            downloadLink.href = card.dataset.file;

            popupBg.style.display = "flex";
        });
    });

    popupBg.addEventListener('click', e => {
        if (e.target === popupBg) popupBg.style.display = "none";
    });
</script>

</body>
</html>
